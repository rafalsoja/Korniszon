version: '3'

tasks:
  run:
    desc: "Run backend with SSL"
    dir: backend
    cmds:
      - uv run uvicorn main:app --host 0.0.0.0 --port 8000 --ssl-keyfile=./certs/server.key --ssl-certfile=./certs/server.crt --reload
    silent: false
  wipe:
    desc: "Wipe the database"
    dir: backend
    cmds:
      - powershell -c "Get-Process python -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue; Remove-Item database.db -ErrorAction SilentlyContinue"
    silent: false