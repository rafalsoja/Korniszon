version: '3'

tasks:
  docker:
    desc: "Rebuild and restart docker containers"
    cmds:
      - docker compose down
      - docker compose up -d --build
    silent: false
  venv:
    desc: "Activate venv and sync deps"
    cmds:
      - powershell -ExecutionPolicy Bypass -File backend/.venv/Scripts/Activate.ps1
      - cd backend && uv sync
    silent: false
  check-format:
    desc: "Check code format"
    cmds:
      - cd backend && uv tool run ruff format --check && uv tool run ruff check
    silent: false
  format:
    desc: "Format code"
    cmds:
      - cd backend && uv tool run ruff format && uv tool run ruff check --fix
    silent: false