name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        enable-cache: true
    
    - name: Set up Python
      run: uv python install 3.13
    
    - name: Install dependencies
      working-directory: ./backend
      run: |
        uv sync
        uv pip install pytest pytest-cov
    
    - name: Run tests
      working-directory: ./backend
      run: uv run pytest --cov=. --cov-report=term-missing tests/
