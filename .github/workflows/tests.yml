name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Build backend image
        working-directory: ./backend
        run: docker build -f Dockerfile.backend -t korniszon-backend:latest .
      
      - name: Run tests
        run: docker run --rm -e RUN_TESTS_ONLY=1 korniszon-backend:latest