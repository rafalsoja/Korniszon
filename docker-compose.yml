services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=sqlite:///app/data/manager.db
    volumes:
      - ./data:/app/data
      - ./server_instances:/app/server_instances
      - /var/run/docker.sock:/var/run/docker.sock 
      - ./certs:/certs
    networks:
      - mc_network
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    networks:
      - mc_network
    expose: 
      - "3000"

  reverse-proxy:
    image: nginx:latest
    volumes:
      - ./certs:/etc/nginx/certs
      - ./nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "443:443"
      - "80:80"
    networks:
      - mc_network

networks:
  mc_network:
    driver: bridge